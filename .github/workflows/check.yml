name: Check reports
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_blocklist.py --check
      - run: python -m unittest discover -s tests -p "test_*.py"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tests/
